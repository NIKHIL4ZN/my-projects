services:
  backend:
    build:
      context: ./backend
    container_name: hustlehub-backend
    env_file:
      - ./backend/.env
    ports:
      - "5000:5000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: https://localhost:5000/api
    container_name: hustlehub-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped