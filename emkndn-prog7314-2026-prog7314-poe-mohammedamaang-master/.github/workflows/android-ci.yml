name: Android CI

# Runs on EVERY branch (the project uses "master", so a main/develop-only filter would never fire),
# on pull requests, and on release tags such as Final-POE.
on:
  push:
    branches: [ "**" ]
    tags: [ "**" ]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # google-services.json is a private file, so it is not committed. If the GOOGLE_SERVICES_JSON
      # repository secret exists it is used; otherwise a harmless stub is written so the app still
      # compiles and the unit tests still run on GitHub's machines.
      - name: Provide google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "Using google-services.json from repository secret"
            printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
          else
            echo "No secret found - writing a CI stub google-services.json"
            cat > app/google-services.json <<'STUB'
          {
            "project_info": { "project_number": "000000000000", "project_id": "ci-stub", "storage_bucket": "ci-stub.appspot.com" },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000",
                  "android_client_info": { "package_name": "com.familylinklive.app" }
                },
                "oauth_client": [ { "client_id": "000000000000-stub.apps.googleusercontent.com", "client_type": 3 } ],
                "api_key": [ { "current_key": "stub-api-key-for-ci-only" } ],
                "services": { "appinvite_service": { "other_platform_oauth_client": [ { "client_id": "000000000000-stub.apps.googleusercontent.com", "client_type": 3 } ] } }
              }
            ],
            "configuration_version": "1"
          }
          STUB
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-unit-test-report
          path: app/build/reports/tests/testDebugUnitTest

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: familylink-live-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
