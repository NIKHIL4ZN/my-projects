
name: HustleHub CI

# Run automatically on pushes and pull requests to main.
# Manual execution is also supported.
on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

jobs:
  backend:
    name: Backend Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: ./backend
        run: npm ci

      - name: Run backend static analysis
        working-directory: ./backend
        run: npm run lint

      - name: Run backend tests
        working-directory: ./backend
        env:
          NODE_ENV: test
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          MONGODB_URI: ${{ secrets.MONGODB_E2E_URI }}
          MONGODB_E2E_URI: ${{ secrets.MONGODB_E2E_URI }}
          JWT_EXPIRES_IN: 1h
        run: npm test

  frontend:
    name: Frontend Tests and Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run frontend static analysis
        working-directory: ./frontend
        run: npm run lint

      - name: Run frontend tests
        working-directory: ./frontend
        run: npm test -- --run

      - name: Build frontend
        working-directory: ./frontend
        run: npm run build

  playwright:
    name: Playwright E2E Tests
    runs-on: ubuntu-latest
    needs:
      - backend
      - frontend

    env:
      CI: true
      NODE_ENV: test
      HTTPS_PORT: 5000
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      JWT_EXPIRES_IN: 1h

      # Both variables use the isolated E2E database.
      # MONGODB_URI satisfies backend environment validation.
      MONGODB_URI: ${{ secrets.MONGODB_E2E_URI }}
      MONGODB_E2E_URI: ${{ secrets.MONGODB_E2E_URI }}

      E2E_CLIENT_EMAIL: ${{ secrets.E2E_CLIENT_EMAIL }}
      E2E_CLIENT_PASSWORD: ${{ secrets.E2E_CLIENT_PASSWORD }}
      E2E_FREELANCER_EMAIL: ${{ secrets.E2E_FREELANCER_EMAIL }}
      E2E_FREELANCER_PASSWORD: ${{ secrets.E2E_FREELANCER_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install backend dependencies
        working-directory: ./backend
        run: npm ci

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: ./frontend
        run: npx playwright install --with-deps chromium

      - name: Generate test HTTPS certificate
        run: |
          mkdir -p backend/certificates
          openssl req -x509 -newkey rsa:2048 \
            -keyout backend/certificates/server.key \
            -out backend/certificates/server.crt \
            -sha256 \
            -days 1 \
            -nodes \
            -subj "/CN=localhost"

      - name: Start test backend
        working-directory: ./backend
        run: |
          node server.js > /tmp/hustlehub-e2e-backend.log 2>&1 &

      - name: Wait for test backend
        run: |
          for i in {1..30}; do
            if curl --fail --silent --insecure \
              https://localhost:5000/api/health; then
              echo "Test backend is healthy."
              exit 0
            fi

            echo "Waiting for test backend..."
            sleep 5
          done

          echo "Test backend failed to start."
          cat /tmp/hustlehub-e2e-backend.log
          exit 1

      - name: Verify isolated database
        run: |
          if ! grep -q "Database: hustlehub_e2e" \
            /tmp/hustlehub-e2e-backend.log; then
            echo "Backend did not confirm the E2E database."
            exit 1
          fi

          echo "Dedicated E2E database confirmed."

      # Playwright config starts the Vite frontend.
      - name: Run Playwright E2E tests
        working-directory: ./frontend
        env:
          VITE_API_URL: https://localhost:5000/api
        run: npx playwright test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload Playwright test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: frontend/test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Show backend logs on failure
        if: failure()
        run: |
          if [ -f /tmp/hustlehub-e2e-backend.log ]; then
            cat /tmp/hustlehub-e2e-backend.log
          fi

  docker:
    name: Docker Full Stack
    runs-on: ubuntu-latest
    needs:
      - backend
      - frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Use the dedicated E2E database for Docker CI.
      # Do not connect Docker CI to development data.
      - name: Create backend environment file
        working-directory: ./backend
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          MONGODB_E2E_URI: ${{ secrets.MONGODB_E2E_URI }}
        run: |
          echo "NODE_ENV=test" > .env
          echo "HTTPS_PORT=5000" >> .env
          printf 'JWT_SECRET=%s\n' "$JWT_SECRET" >> .env
          echo "JWT_EXPIRES_IN=1h" >> .env

          # Supply both variables using the E2E connection string.
          printf 'MONGODB_URI=%s\n' "$MONGODB_E2E_URI" >> .env
          printf 'MONGODB_E2E_URI=%s\n' "$MONGODB_E2E_URI" >> .env

      - name: Generate CI HTTPS certificate
        run: |
          mkdir -p backend/certificates
          openssl req -x509 -newkey rsa:2048 \
            -keyout backend/certificates/server.key \
            -out backend/certificates/server.crt \
            -sha256 \
            -days 1 \
            -nodes \
            -subj "/CN=localhost"

      - name: Build backend Docker image
        run: docker build -t hustlehub-backend ./backend

      - name: Build frontend Docker image
        run: docker build -t hustlehub-frontend ./frontend

      - name: Start full stack with Docker Compose
        run: docker compose up -d --build

      - name: Wait for backend
        run: |
          for i in {1..30}; do
            if curl --fail --silent --insecure \
              https://localhost:5000/api/health; then
              echo "Backend is healthy."
              exit 0
            fi

            echo "Waiting for backend..."
            sleep 5
          done

          echo "Backend failed to become available."
          docker compose ps
          docker compose logs backend
          exit 1

      - name: Wait for frontend
        run: |
          for i in {1..30}; do
            if curl --fail --silent http://localhost:8080; then
              echo "Frontend is healthy."
              exit 0
            fi

            echo "Waiting for frontend..."
            sleep 2
          done

          echo "Frontend failed to become available."
          docker compose ps
          docker compose logs frontend
          exit 1

      - name: Show running containers
        run: docker compose ps

      - name: Stop Docker Compose
        if: always()
        run: docker compose down
